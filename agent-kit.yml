tracker:
  provider: github
  backend: projects_v2
  repo:
    url: https://github.com/Peter-Kung/ALM-System-Web
  project:
    url: https://github.com/users/Peter-Kung/projects/6

mapping:
  type:
    storage: field
    field: Type
    values:
      story: Story
      bug: Bug
      task: Task
  status:
    storage: field
    field: Status
    values:
      todo: Todo
      in_progress: In Progress
      blocked: Blocked
      done: Done

  label:
    storage: label
    values:
      agent: agent
      review: review
      needs_breakdown: needs-breakdown
      investigation: investigation

docs:
  source_of_truth:
    - docs/
