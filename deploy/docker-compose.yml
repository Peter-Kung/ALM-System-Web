services:
  app:
    image: ${ALM_IMAGE:-ghcr.io/peter-kung/alm-system-web:latest}
    container_name: ${ALM_CONTAINER_NAME:-alm-system}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ALM_BACKUP_DIR: /var/lib/alm-system/backups
      ALM_DATA_DIR: /var/lib/alm-system/data
      ALM_STORAGE_ROOT: /var/lib/alm-system
      ALM_UPDATE_STATE_DIR: /var/lib/alm-system/update-state
      ALM_UPLOADS_DIR: /var/lib/alm-system/uploads
      DATABASE_URL: file:/var/lib/alm-system/data/alm-system.db
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${ALM_HTTP_BIND:-127.0.0.1}:${ALM_HTTP_PORT:-3000}:3000"
    volumes:
      - ./data:/var/lib/alm-system/data
      - ./backups:/var/lib/alm-system/backups
      - ./update-state:/var/lib/alm-system/update-state
      - ./uploads:/var/lib/alm-system/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
